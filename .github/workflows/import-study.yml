name: Import the published study site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-study.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Import this course and apply its new name
        shell: bash
        run: |
          set -euo pipefail
          test ! -e index.html
          git fetch --no-tags --depth=1 https://github.com/GeorgeDharma/georgedharma.github.io.git 76dc81b9934cb5e0216ca76da0231a2e9a8a819d
          git archive 'FETCH_HEAD:french-study' | tar -x
          python - frenchwithgeorge . <<'PYTHON'
          from pathlib import Path
          import sys


          def edit(path, replacements):
              content = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if old not in content:
                      raise ValueError(f"{path} is missing the expected text {old!r}")
                  content = content.replace(old, new)
              path.write_text(content, encoding="utf-8")


          project, root = sys.argv[1], Path(sys.argv[2])
          if project == "frenchwithgeorge":
              title = "French with George"
              edit(root / "index.html", [
                  ("<title>Carnet de français · My study desk</title>", '<meta name="author" content="George Dharma"><title>French with George · My study desk</title>'),
                  ('aria-label="Carnet de français, study desk"', 'aria-label="French with George, study desk"'),
                  ("<span>Carnet<small>DE FRANÇAIS</small></span>", "<span>French<small>with George</small></span>"),
              ])
              edit(root / "app.js", [
                  (" · Carnet de français", " · French with George"),
                  ("<span>My workspace</span><i>/</i>", "<span>French with George</span><i>/</i>"),
                  ("<h1 lang=\"fr\">Bonjour</h1>", '<span class="study-byline">By George Dharma</span><h1 lang="fr">Bonjour</h1>'),
                  ("'Carnet-progress-'", "'French-with-George-progress-'"),
                  ("Choose a valid Carnet progress JSON file.", "Choose a valid French with George progress backup."),
              ])
              edit(root / "core.js", [("Choose a Carnet progress backup.", "Choose a French with George progress backup.")])
              with (root / "teaching.css").open("a", encoding="utf-8") as css:
                  css.write("\n.study-byline { display: block; color: var(--muted); font-size: .875rem; margin-bottom: .375rem; }\n")
              summary = "French lessons, listening exercises, grammar practice and quizzes for English-speaking learners. Start at A1 or choose a lesson from the study desk."
              notes = "Your progress and any materials you import stay in your browser. Use the progress export on the site to keep a backup."
          elif project == "financewithgeorge":
              title = "Finance with George"
              for page in root.rglob("*.html"):
                  edit(page, [
                      ('<meta charset="utf-8">', '<meta charset="utf-8"><meta name="author" content="George Dharma">'),
                      ('aria-label="George Dharma Finance Classroom home"', 'aria-label="Finance with George home"'),
                      ("Finance Classroom", title),
                  ])
              edit(root / "index.html", [("Self-paced curriculum</div>", "Finance with George</div>")])
              edit(root / "assets/classroom.js", [
                  ("'Finance-Classroom-learning-'", "'Finance-with-George-learning-'"),
                  ("a valid finance classroom progress backup.", "a valid Finance with George progress backup."),
              ])
              summary = "Study valuation, deals and financial markets through worked examples and practice questions. Browse the subject catalog or choose a workshop from the study desk."
              notes = "Your progress is saved in your browser. Open My learning to export a backup."
          else:
              raise ValueError(f"Unexpected study site {project!r}")
          (root / ".nojekyll").touch()
          (root / "README.md").write_text(
              f"# {title}\n\nBy George Dharma.\n\n{summary}\n\n"
              f"[Open {title}](https://georgedharma.github.io/{project}/)\n\n{notes}\n",
              encoding="utf-8",
          )
          PYTHON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publish French with George as a standalone study site"
          git push origin HEAD:refs/heads/main
